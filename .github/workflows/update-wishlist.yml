name: Refresh community wishlist
on:
  schedule:
    - cron: "0 9 * * 1" # every Monday 09:00 UTC
  workflow_dispatch: {}   # allow manual runs from the Actions tab
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node scripts/update-wishlist.mjs
      - name: Commit if changed
        run: |
          git config user.name "wishlist-bot"
          git config user.email "actions@github.com"
          git add api/_lib/wishlist.json
          git diff --cached --quiet || (git commit -m "chore: weekly wishlist refresh" && git push)
